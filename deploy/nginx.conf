# /etc/nginx/sites-available/bali-islands
# Then: ln -s ../sites-available/bali-islands /etc/nginx/sites-enabled/ && nginx -t && systemctl reload nginx
#       certbot --nginx -d bali-islands.com -d www.bali-islands.com
server {
    listen 80;
    server_name bali-islands.com www.bali-islands.com;

    client_max_body_size 200M;   # bulk photo / video uploads in the admin

    location /media/ {
        alias /var/www/bali-islands/media/;   # = MEDIA_DIR in .env
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8010;     # = WEB_PORT in .env
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
