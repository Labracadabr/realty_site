# /etc/nginx/sites-available/lovinaland  (then: certbot --nginx -d lovinaland.com -d www.lovinaland.com)
server {
    listen 80;
    server_name lovinaland.com www.lovinaland.com;

    client_max_body_size 200M;   # bulk photo / video uploads in the admin

    # Media volume: docker volume inspect realty_site_media -> Mountpoint
    location /media/ {
        alias /var/lib/docker/volumes/realty_site_media/_data/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
